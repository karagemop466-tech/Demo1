name: Collect Kalshi demo data

# GitHub-hosted runners have unrestricted outbound internet, so this is where
# live official Kalshi demo data is collected. The collector writes data/*.json
# plus a full request log, which the job commits back to this branch so the
# values can be reviewed (and each row keeps the exact API URL it came from).
on:
  push:
    branches:
      - arena/4df8be5b-demo1
    paths:
      - tools/**
      - .github/workflows/live-data.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "collect or explore"
        required: false
        default: "collect"

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reachability check against official hosts
        run: |
          set +e
          curl -sS -m 20 -o /dev/null -w "demo exchange/status: %{http_code}\n" \
            https://external-api.demo.kalshi.co/trade-api/v2/exchange/status
          curl -sS -m 20 -o /dev/null -w "demo alt host: %{http_code}\n" \
            https://demo-api.kalshi.co/trade-api/v2/exchange/status
          curl -sS -m 20 -o /dev/null -w "docs.kalshi.com: %{http_code}\n" \
            https://docs.kalshi.com/llms.txt
      - name: Explore data landscape
        run: python tools/collect_kalshi.py explore
      - name: Collect dataset
        run: python tools/collect_kalshi.py collect
      - name: Summary
        if: always()
        run: |
          {
            echo "### Kalshi demo collection log"
            echo '```'
            tail -c 12000 data/collect-log.txt 2>/dev/null || echo "no log written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit collected data back to the branch
        if: always()
        run: |
          git config user.name "kalshi-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ || true
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "data: Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
