name: Refresh Kalshi demo data snapshot

# Pulls the official public Kalshi demo Trade API responses into data/ so the
# GitHub Pages site can show live values without a backend or API keys.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: demo-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Kalshi demo market data
        run: python3 scripts/fetch_demo_data.py --out data
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): refresh Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
