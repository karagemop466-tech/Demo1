name: alert-desk check

# Session arena/0ad208bf-demo1 (AL-3): additive check for the two-chat alert desk.
# Only touches alert-desk/**; no shared workflow is modified.
on:
  push:
    paths:
      - "alert-desk/**"
      - ".github/workflows/alert-desk-check.yml"
  pull_request:
    paths:
      - "alert-desk/**"
      - ".github/workflows/alert-desk-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 31 -> undici 8 requires node:zstd (Node >= 22); under Node 20 the
          # test crashes at import time with
          # "TypeError: Cannot read properties of undefined (reading 'bind')" in
          # undici/lib/interceptor/decompress.js. Node 22 verified: 35/35 locally.
          node-version: "22"
      - name: Install jsdom
        run: npm install --no-audit --no-fund --silent jsdom
      - name: Syntax check
        run: node --check alert-desk/app.js && node --check alert-desk/test_boot.mjs
      - name: Boot test (offline + live-tape paths)
        run: |
          set -o pipefail
          node alert-desk/test_boot.mjs 2>&1 | tee /tmp/boot-test.log
      - name: Surface test output as run annotations (log endpoint can be unavailable)
        if: failure()
        run: |
          tail -c 3500 /tmp/boot-test.log | fold -w 850 | while IFS= read -r line; do
            echo "::error::${line}"
          done
