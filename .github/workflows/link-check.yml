name: Link & syntax check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS syntax check
        run: |
          fail=0
          for f in assets/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Internal link check
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = os.getcwd()
          pages = [f for f in os.listdir(root) if f.endswith('.html')]
          errors = []
          for page in pages:
              text = open(page, encoding='utf-8').read()
              for m in re.finditer(r'(?:href|src)="([^"#]+)"', text):
                  url = m.group(1)
                  if url.startswith(('http://', 'https://', 'data:', 'mailto:')):
                      continue
                  path = url.split('?')[0].split('#')[0]
                  if path and not os.path.exists(os.path.join(root, path)):
                      errors.append(f'{page}: broken link -> {url}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'OK: internal links valid across {len(pages)} pages')
          PY

      - name: JSON validity check
        run: |
          python3 - <<'PY'
          import json, sys
          json.load(open('data/series-map.json'))
          print('OK: data/series-map.json valid')
          PY
