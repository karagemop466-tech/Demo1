name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static files and local links
        run: |
          test -s index.html
          test -s app.js
          node --check app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('href','src') and value:
                          self.refs.append(value)
          pages = list(Path('.').glob('*.html'))
          assert pages, 'No HTML pages found'
          for page in pages:
              parser=Check(); parser.feed(page.read_text())
              for ref in parser.refs:
                  u=urlparse(ref)
                  if u.scheme or u.netloc or ref.startswith('#') or not u.path:
                      continue
                  target=(page.parent/u.path).resolve()
                  assert target.exists(), f'{page}: broken local reference {ref}'
          print(f'Parsed {len(pages)} HTML pages and checked local references')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
