name: Build and deploy site to GitHub Pages

# GitHub Pages for this repository is configured in "legacy" mode: it serves the
# repository root of `main` over a static file server, so no custom Pages
# workflow can be selected from the repository settings by this session.
# This workflow therefore rebuilds the site from the committed verified snapshot
# and, if the generated output differs, commits it to main. Pages then publishes
# it automatically. The build fails (and nothing is committed) if the site does
# not build cleanly or has a broken internal link.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-content
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JavaScript
        run: |
          node --check assets/chart.js
          node --check assets/explore.js
          node --check app.js
      - name: Validate Python
        run: python -m py_compile build_site.py tools/collect_kalshi.py tools/account_worker.py
      - name: Build site (fails on broken internal link or missing asset)
        run: python build_site.py
      - name: Verify no placeholder values leaked into rendered pages
        run: |
          set -e
          if grep -rIn --include='*.html' -E 'undefined|NaN|>None<|\{[' site/ | head -20; then
            echo "found suspicious rendered tokens"; exit 1
          fi
          echo "no undefined/NaN/None tokens in rendered pages"
      - name: Commit rebuilt site if it changed
        run: |
          git config user.name "site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "site output unchanged"
          else
            git commit -m "site: rebuild from verified snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
            echo "committed rebuilt site to main"
          fi
