name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  workflow_run:
    workflows: ['Refresh Kalshi demo data']
    types: [completed]
  schedule:
    # Safety net in case the refresh workflow fails. The refresh workflow normally
    # triggers a deploy through workflow_run.
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node --check
          echo "all JS files parsed"

      - name: Validate site structure and links
        run: node scripts/check-site.mjs

      - name: Capture live Kalshi demo data
        continue-on-error: true
        run: node scripts/fetch-demo-data.mjs

      - name: Capture demo account snapshot (runs only when credentials exist)
        continue-on-error: true
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: node scripts/fetch-account.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
