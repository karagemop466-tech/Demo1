name: Deploy static site to GitHub Pages
# SINGLE-PUBLISHER POLICY (session fab3e340, task PD-2 — see DEPLOYMENT.md):
# This workflow is the ONLY publisher for the GitHub Pages site. The repository's
# Pages settings must keep build_type "workflow" (Source: GitHub Actions).
# GitHub documents exactly one publishing source per site — a branch (built-in
# builder) or a custom workflow — and having both configured (branch source +
# this workflow) left the built-in "pages build and deployment" runs failing
# with "Page build failed." and the site stale (5 of 7 builds errored 19:36–19:42 UTC).
# Source: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
on:
  push:
    branches: [main]
  schedule:
    # The three data pipelines commit to main with the repository's GITHUB_TOKEN
    # every 15 minutes; pushes made with GITHUB_TOKEN do not trigger push events
    # for Actions workflows, so this timed redeploy of the default-branch tip
    # keeps bot-committed data refreshes flowing to Pages. Timed runs of the
    # default branch deploy its latest commit (docs: "schedule" event).
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check monitor/app.js
      - name: Validate required files
        run: test -s index.html && test -s monitor/index.html && test -s monitor/styles.css && test -s monitor/app.js && test -s assets/style.css && test -s assets/common.js && test -s assets/dashboard.js && test -s data/markets.json
      - name: Validate live desk scripts
        run: node --check assets/js/kalshi-core.js && node --check assets/js/kalshi-ui.js && node --check assets/js/live.js && node --check tools/kalshi-signer.mjs && node --check tools/check-links.mjs && node --check tests/dashboard.test.mjs && python3 -m py_compile scripts/fetch_demo_data.py
      - name: Rebuild verified dashboard from committed snapshot (fails on broken links)
        run: |
          python3 -m py_compile build_site.py tools/collect_kalshi.py tools/account_worker.py
          python3 build_site.py
      - name: Validate verified-dashboard JavaScript
        run: node --check site/assets/chart.js && node --check site/assets/explore.js
      - name: Kalshi desk — build and link check
        run: |
          python3 desk/tools/desk_data.py
          python3 desk/tools/build_pages.py
          # desk/tools/dom_test.mjs imports jsdom (devDependency in package.json);
          # a fresh runner has no node_modules, so install it first (same as desk.yml does).
          npm install --no-audit --no-fund --silent jsdom
          node --check desk/assets/core.js
          node --check desk/assets/live.js
          node desk/tools/dom_test.mjs

      - name: Site link, secrets and source-citation audit
        run: node tools/check-links.mjs
      - name: Remove dev dependencies from the deployed artifact
        # The desk test step installs jsdom into ./node_modules; upload-pages-artifact
        # uploads everything under `path`, so dev dependencies must be dropped before
        # upload or they are published with the site.
        run: rm -rf node_modules
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
