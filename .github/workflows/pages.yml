name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check monitor/app.js
      - name: Validate required files
        run: test -s index.html && test -s monitor/index.html && test -s monitor/styles.css && test -s monitor/app.js && test -s assets/style.css && test -s assets/common.js && test -s assets/dashboard.js && test -s data/markets.json
      - name: Validate live desk scripts
        run: node --check assets/js/kalshi-core.js && node --check assets/js/kalshi-ui.js && node --check assets/js/live.js && node --check tools/kalshi-signer.mjs && node --check tools/check-links.mjs && node --check tests/dashboard.test.mjs && python3 -m py_compile scripts/fetch_demo_data.py
      - name: Rebuild verified dashboard from committed snapshot (fails on broken links)
        run: |
          python3 -m py_compile build_site.py tools/collect_kalshi.py tools/account_worker.py
          python3 build_site.py
      - name: Validate verified-dashboard JavaScript
        run: node --check site/assets/chart.js && node --check site/assets/explore.js
      - name: Kalshi desk — build and link check
        run: |
          python3 desk/tools/desk_data.py
          python3 desk/tools/build_pages.py
          # desk/tools/dom_test.mjs imports jsdom (devDependency in package.json);
          # a fresh runner has no node_modules, so install it first (same as desk.yml does).
          npm install --no-audit --no-fund --silent jsdom
          node --check desk/assets/core.js
          node --check desk/assets/live.js
          node desk/tools/dom_test.mjs

      - name: Site link, secrets and source-citation audit
        run: node tools/check-links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
