name: Pages deploy validation
# SINGLE-PUBLISHER POLICY (session fab3e340, task PD-2 — see DEPLOYMENT.md):
# The ONLY publisher for the GitHub Pages site is the built-in branch builder
# (Pages source `main:/`, REST `build_type: "legacy"`). This workflow VALIDATES
# the tree (required files, JS syntax, verified-dashboard rebuild with its link
# check, desk DOM tests, repository link/secret audit) on pushes to main and on
# pull requests, but it deliberately has NO deploy job and NO artifact upload,
# so it can never cancel or race the deployment.
#
# History that motivated this: while this workflow still had a deploy job, the
# two publishers shared the "pages" concurrency group and cancelled each other
# on every push during the 2026-11-20 merge storm (Actions runs show cancel
# pairs from 19:36 UTC; the Pages builds API recorded the superseded builds as
# errored "Page build failed.", and the live site froze at the 19:37:57Z build —
# trade-desk/ and alert-desk/ stayed undeployed). Making the Pages build_type
# switch to "workflow" (REST PUT /pages) was attempted and denied:
# {"message":"Resource not accessible by integration","status":403} — the token
# lacks the administrator-level "manage GitHub Pages settings" permission, so the
# built-in builder stays the publisher and this workflow validates only.
# Source: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keyed per event AND per ref, so one branch's validation cannot cancel another's.
  # Previously the pull_request group was shared by every PR: on 2026-11-21 an
  # unrelated session's push cancelled this PR's validation and the cancelled run was
  # reported as a failed `build` check ("Canceling since a higher priority waiting
  # request for pages-validation-pull_request exists"). Superseded runs of the SAME ref
  # still cancel, which is the wanted newest-commit behaviour.
  group: pages-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check monitor/app.js
      - name: Validate required files
        run: test -s index.html && test -s monitor/index.html && test -s monitor/styles.css && test -s monitor/app.js && test -s assets/style.css && test -s assets/common.js && test -s assets/dashboard.js && test -s data/markets.json
      - name: Validate live desk scripts
        run: node --check assets/js/kalshi-core.js && node --check assets/js/kalshi-ui.js && node --check assets/js/live.js && node --check tools/kalshi-signer.mjs && node --check tools/check-links.mjs && node --check tests/dashboard.test.mjs && python3 -m py_compile scripts/fetch_demo_data.py
      - name: Rebuild verified dashboard from committed snapshot (fails on broken links)
        run: |
          python3 -m py_compile build_site.py tools/collect_kalshi.py tools/account_worker.py
          python3 build_site.py
      - name: Validate verified-dashboard JavaScript
        run: node --check site/assets/chart.js && node --check site/assets/explore.js
      - name: Kalshi desk — build and link check
        run: |
          python3 desk/tools/desk_data.py
          python3 desk/tools/build_pages.py
          # desk/tools/dom_test.mjs imports jsdom (devDependency in package.json);
          # a fresh runner has no node_modules, so install it first (same as desk.yml does).
          npm install --no-audit --no-fund --silent jsdom
          node --check desk/assets/core.js
          node --check desk/assets/live.js
          node desk/tools/dom_test.mjs

      - name: Site link, secrets and source-citation audit
        run: node tools/check-links.mjs
