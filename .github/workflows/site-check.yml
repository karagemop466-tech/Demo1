name: site-check
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: python3 scripts/check_links.py
      - name: Syntax-check all JS
        run: |
          for f in js/*.js; do node --check "$f"; done
