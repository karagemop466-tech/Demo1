name: Kalshi demo data pipeline

# Fetches live market data from the official Kalshi DEMO Trade API
# (https://external-api.demo.kalshi.co/trade-api/v2) for the five tracked topics,
# updates docs/data/*.json, and (on main) commits the refreshed data so GitHub
# Pages serves it. Data commits are path-ignored here to prevent a trigger loop.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Smoke test with reduced caps"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/data/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: kalshi-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Kalshi demo data (no credentials — public market-data endpoints only)
        id: fetch
        run: |
          set -o pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.quick == true }}" = "true" ]; then
            python3 scripts/fetch_kalshi_data.py --out docs/data --quick
          else
            python3 scripts/fetch_kalshi_data.py --out docs/data
          fi

      - name: Validate generated JSON
        run: |
          python3 - <<'PY'
          import json, glob
          for p in sorted(glob.glob("docs/data/*.json")):
              with open(p) as f:
                  json.load(f)
              print("valid:", p)
          PY

      - name: Upload data artifact (every run, incl. branches/PRs)
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-demo-data
          path: docs/data/
          retention-days: 14

      - name: Commit refreshed data (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BR=main
          # Commit the refresh on top of whatever tip this run started from.
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "No data changes."; exit 0
          fi
          git config user.name "kalshi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git commit -m "data: refresh Kalshi demo snapshot [skip ci]" --no-verify
          DATA_COMMIT="$(git rev-parse HEAD)"
          echo "data commit: $DATA_COMMIT"
          for attempt in 1 2 3; do
            echo "attempt $attempt: fetching and rebasing on $BR"
            git fetch origin "$BR"
            if git rebase "origin/$BR"; then
              if git push origin "HEAD:$BR"; then
                echo "PUBLISHED data refresh on attempt $attempt"; exit 0
              fi
              echo "push rejected on attempt $attempt - retrying"
              continue
            fi
            echo "rebase conflict on attempt $attempt - rebuilding the data commit on the remote tip"
            git rebase --abort || true
            git reset --hard "origin/$BR"
            git checkout "$DATA_COMMIT" -- docs/data
            git add docs/data
            git commit -m "data: refresh Kalshi demo snapshot [skip ci]" --no-verify
            sleep 2
          done
          echo "could not publish data refresh after 3 attempts"; exit 1
